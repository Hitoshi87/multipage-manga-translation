name: Source checks
on: [push, pull_request]
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie tesseract-ocr-jpn tesseract-ocr-jpn-vert tesseract-ocr-chi-sim tesseract-ocr-chi-tra tesseract-ocr-kor
      - name: Create project virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.txt -r requirements-ai.txt
      - run: python -m unittest discover -s tests -q
      - run: node tests/test_windows_launcher.js
      - run: node tests/test_engine_review_ui.js
      - run: node tests/test_ui_modes.js
      - run: node tests/test_series_styles.js && node tests/test_style_manager_ui.js && node tests/test_review_lettering.js && node tests/test_review_style_ui.js
      - run: node tests/chapter_dialog.js
      - run: python scripts/build_source_bundle.py --check
      - run: node tests/test_native_smoke.js
      - name: Test source distribution
        run: |
          python scripts/build_source_bundle.py --out "$RUNNER_TEMP/source/manga-typesetter"
          cd "$RUNNER_TEMP/source/manga-typesetter"
          python -m unittest discover -s tests -q
          node tests/test_engine_review_ui.js
          node tests/test_ui_modes.js
          node tests/test_series_styles.js
          node tests/test_style_manager_ui.js
          node tests/test_review_lettering.js
          node tests/test_review_style_ui.js
